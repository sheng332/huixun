<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f0">
<title>回讯</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="回讯">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23111'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23f5f5f2' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.6 5.4 8 12l6.6 6.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18" cy="12" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19.5V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3.2c.5 4.6 1.7 5.8 6.3 6.3-4.6.5-5.8 1.7-6.3 6.3-.5-4.6-1.7-5.8-6.3-6.3 4.6-.5 5.8-1.7 6.3-6.3Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M18.4 15.2c.2 1.9.7 2.4 2.6 2.6-1.9.2-2.4.7-2.6 2.6-.2-1.9-.7-2.4-2.6-2.6 1.9-.2 2.4-.7 2.6-2.6Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m15.2 15.2 4.3 4.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4.5 7h13M4.5 12h9M4.5 17h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M19 4.5v9m-2.4-2.4L19 13.5l2.4-2.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.8 7h14.4M9 7V4.8h6V7M6.6 7l.9 12.2h9l.9-12.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.8 4.5h10.4v15.2L12 16.2 6.8 19.7V4.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 8v5M9.5 10.5h5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3.5 8.5c2.4 3 5.2 4.6 8.5 4.6s6.1-1.6 8.5-4.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12 13.1V17M6.2 12l-1.6 3M17.8 12l1.6 3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.8 9.6 17.4 19 7.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6.5 9.5 12 15l5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.8v10.4M8 10.6l4 4 4-4M4.8 19.2h14.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15.8V5.4M8 9.4l4-4 4 4M4.8 19.2h14.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5.2 9.2A7.4 7.4 0 1 1 4.8 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5.5 4.6v4.8h4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.8 18.6c0-3 2.3-5 5.2-5s5.2 2 5.2 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M15.6 6.3a3 3 0 0 1 .8 5.4M17.4 13.9c1.7.4 2.9 1.8 2.9 4.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.6 16.8V11a5.4 5.4 0 0 1 10.8 0v5.8l1.6 2.2H5l1.6-2.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9.8 19.2a2.4 2.4 0 0 0 4.4 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4.5 9.2h3.2L12 5.6v12.8L7.7 14.8H4.5V9.2Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M15 9a4.4 4.4 0 0 1 0 6M17.8 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.8" y="5.2" width="16.4" height="13.6" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8.4" cy="9.6" r="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="m5.2 17 4.6-4.6 3.1 3.1 2.6-2.2 3.2 3.7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h7M15 7h5M4 12h3M11 12h9M4 17h10M18 17h2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="13" cy="7" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="9" cy="12" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="16" cy="17" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M3.8 7.8h6l1.8 2h8.6v9.4H3.8V7.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M14.2 5.2v6M11.6 7.8l2.6-2.6 2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4.8 19.2 4.7-1L19 8.4 15.6 5 5.8 14.5l-1 4.7Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m13.6 7 3.4 3.4" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 5.8 18 12l-9.5 6.2V5.8Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
  <symbol id="i-select" viewBox="0 0 24 24"><rect x="4.2" y="4.2" width="15.6" height="15.6" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="m8 12.3 2.7 2.7 5.3-5.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4.4 11.2c0-3.5 3.4-6.2 7.6-6.2s7.6 2.7 7.6 6.2-3.4 6.2-7.6 6.2c-.9 0-1.8-.1-2.6-.4L5.2 19l.7-3.2c-.9-1.3-1.5-2.8-1.5-4.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="11.2" r="1.05" fill="currentColor"/><circle cx="12" cy="11.2" r="1.05" fill="currentColor"/><circle cx="15" cy="11.2" r="1.05" fill="currentColor"/></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><rect x="6.8" y="4.4" width="12.4" height="15.2" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(6 13 12)"/><rect x="4.8" y="6.2" width="12.4" height="15.2" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-5 11 13)"/><path d="M8.8 11.6h4.4M8.6 14.6h6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 3.4v2.2M12 18.4v2.2M3.4 12h2.2M18.4 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
</svg>

<div id="app">
  <main id="home" class="home">
    <div class="home-glow"></div>
    <div class="home-inner">
      <div class="home-clock" id="homeClock">--:--</div>
      <div class="home-date" id="homeDate"></div>
      <div class="app-grid">
        <button class="app-entry" data-open="chat" aria-label="对话">
          <span class="app-tile"><svg class="app-ico"><use href="#i-chat"></use></svg></span>
          <span class="app-label">对话</span>
        </button>
        <button class="app-entry" data-open="cards" aria-label="字卡">
          <span class="app-tile"><svg class="app-ico"><use href="#i-cards"></use></svg></span>
          <span class="app-label">字卡</span>
        </button>
        <button class="app-entry" data-open="settings" aria-label="设置">
          <span class="app-tile"><svg class="app-ico"><use href="#i-gear"></use></svg></span>
          <span class="app-label">设置</span>
        </button>
      </div>
      <div class="home-foot"><span class="home-brand">H U I X U N</span></div>
    </div>
  </main>

  <section class="app-screen" id="app-chat" aria-label="对话">
    <header class="app-bar">
      <button class="bar-btn" data-close-screen aria-label="返回"><svg class="ic"><use href="#i-back"></use></svg></button>
      <div class="bar-center">
        <span class="bar-avatar" id="chatPeerAvatar"></span>
        <span class="bar-name" id="chatPeerName">林深</span>
      </div>
      <button class="bar-btn" id="chatMenuBtn" aria-label="更多"><svg class="ic"><use href="#i-more"></use></svg></button>
    </header>
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-bg" id="chatBg"></div>
      <div class="msg-list" id="msgList"></div>
    </div>
    <footer class="composer">
      <input id="msgInput" class="composer-input" type="text" autocomplete="off" placeholder="说点什么">
      <button class="composer-btn ghost" id="triggerBtn" aria-label="触发回复"><svg class="ic"><use href="#i-spark"></use></svg></button>
      <button class="composer-btn solid" id="sendBtn" aria-label="发送"><svg class="ic"><use href="#i-send"></use></svg></button>
    </footer>
  </section>

  <section class="app-screen" id="app-cards" aria-label="字卡">
    <header class="app-bar">
      <button class="bar-btn" data-close-screen aria-label="返回"><svg class="ic"><use href="#i-back"></use></svg></button>
      <div class="bar-title">字卡</div>
      <button class="bar-text-btn" id="cardManageBtn">选择</button>
    </header>
    <div class="cards-toolbar">
      <div class="search-field">
        <svg class="ic"><use href="#i-search"></use></svg>
        <input id="cardSearch" type="text" placeholder="搜索" autocomplete="off">
      </div>
      <button class="tool-btn" id="cardSortBtn" aria-label="排序"><svg class="ic"><use href="#i-sort"></use></svg></button>
      <button class="tool-btn" id="cardMenuBtn" aria-label="更多"><svg class="ic"><use href="#i-more"></use></svg></button>
    </div>
    <div class="chips" id="groupChips"></div>
    <div class="cards-scroll" id="cardsScroll">
      <div id="cardsBody"></div>
      <div class="list-pad"></div>
    </div>
    <button class="fab" id="addCardBtn" aria-label="添加字卡"><svg class="ic"><use href="#i-plus"></use></svg></button>
    <div class="batch-bar" id="batchBar">
      <button class="batch-all" id="batchAll">全选</button>
      <span class="batch-count" id="batchCount">0</span>
      <div class="batch-actions">
        <button class="batch-btn" id="batchMove" aria-label="移动"><svg class="ic"><use href="#i-move"></use></svg></button>
        <button class="batch-btn" id="batchHide" aria-label="屏蔽"><svg class="ic"><use href="#i-eyeoff"></use></svg></button>
        <button class="batch-btn danger" id="batchDelete" aria-label="删除"><svg class="ic"><use href="#i-trash"></use></svg></button>
      </div>
    </div>
  </section>

  <section class="app-screen" id="app-settings" aria-label="设置">
    <header class="app-bar">
      <button class="bar-btn" data-close-screen aria-label="返回"><svg class="ic"><use href="#i-back"></use></svg></button>
      <div class="bar-title">设置</div>
      <span class="bar-btn"></span>
    </header>
    <div class="settings-scroll">
      <div class="group-title">回复</div>
      <div class="setting-card">
        <div class="row"><span class="row-label">回复延迟</span><span class="row-val" id="delayVal">4 秒</span></div>
        <div class="row range-row"><input class="range" type="range" min="1" max="300" step="1" data-setting="delaySec"></div>
        <div class="row"><span class="row-label">主动消息</span><input type="checkbox" class="switch" data-setting="activeEnabled"></div>
        <div class="row dep" data-dep="activeEnabled"><span class="row-label">间隔</span><span class="row-val" id="activeVal">10 分钟</span></div>
        <div class="row range-row dep" data-dep="activeEnabled"><input class="range" type="range" min="1" max="60" step="1" data-setting="activeMin"></div>
        <div class="row"><span class="row-label">已读不回</span><input type="checkbox" class="switch" data-setting="noReply"></div>
        <div class="row dep" data-dep="noReply"><span class="row-label">不回复概率</span><span class="row-val" id="noReplyVal">30%</span></div>
        <div class="row range-row dep" data-dep="noReply"><input class="range" type="range" min="5" max="90" step="5" data-setting="noReplyRate"></div>
        <div class="row"><span class="row-label">引用回复</span><input type="checkbox" class="switch" data-setting="quote"></div>
        <div class="row"><span class="row-label">连句</span><input type="checkbox" class="switch" data-setting="combine"></div>
        <div class="row"><span class="row-label">正在输入</span><input type="checkbox" class="switch" data-setting="typing"></div>
        <div class="row dep" data-dep="typing"><span class="row-label">文案</span><input class="field mid" type="text" maxlength="24" data-setting="typingText"></div>
      </div>

      <div class="group-title">外观</div>
      <div class="setting-card">
        <div class="row"><span class="row-label">主题</span>
          <div class="seg" id="themeSeg">
            <button data-theme-choice="auto">跟随</button>
            <button data-theme-choice="light">日</button>
            <button data-theme-choice="dark">夜</button>
          </div>
        </div>
        <div class="row"><span class="row-label">字体大小</span><span class="row-val" id="fontVal">15</span></div>
        <div class="row range-row"><input class="range" type="range" min="12" max="22" step="1" data-setting="fontSize"></div>
        <div class="row stack"><span class="row-label">字体</span><input class="field full" type="text" data-setting="fontFamily" spellcheck="false"></div>
        <div class="row stack"><span class="row-label">字体链接</span><input class="field full" type="text" data-setting="fontUrl" placeholder="CSS 或字体 URL" spellcheck="false"></div>
        <div class="row"><span class="row-label">显示名称</span><input type="checkbox" class="switch" data-setting="showName"></div>
        <div class="row"><span class="row-label">显示头像</span><input type="checkbox" class="switch" data-setting="showAvatar"></div>
        <div class="row"><span class="row-label">时间戳</span><input type="checkbox" class="switch" data-setting="showTime"></div>
        <div class="row"><span class="row-label">已读</span><input type="checkbox" class="switch" data-setting="showRead"></div>
        <div class="row dep" data-dep="showRead"><span class="row-label">已读文案</span><input class="field mid" type="text" maxlength="8" data-setting="readText"></div>
        <div class="row"><span class="row-label">聊天背景</span>
          <div class="mini-actions">
            <span class="bg-preview" id="bgPreview"></span>
            <button class="mini-btn" id="bgPick">更换</button>
            <button class="mini-btn" id="bgClear">清除</button>
          </div>
        </div>
        <div class="row stack">
          <div class="row-head"><span class="row-label">气泡样式</span><button class="mini-btn" id="bubbleReset">恢复</button></div>
          <textarea class="field area" rows="4" data-setting="bubbleCss" placeholder="CSS，或样式表 URL" spellcheck="false"></textarea>
        </div>
      </div>

      <div class="group-title">角色</div>
      <div class="setting-card">
        <div class="row"><span class="row-label">名称</span><input class="field mid" type="text" maxlength="12" data-setting="peerName"></div>
        <div class="row"><span class="row-label">头像</span>
          <div class="mini-actions">
            <span class="mini-avatar" id="peerAvatarPreview"></span>
            <button class="mini-btn" id="peerAvatarPick">更换</button>
            <button class="mini-btn" id="peerAvatarClear">清除</button>
          </div>
        </div>
      </div>

      <div class="group-title">声音</div>
      <div class="setting-card">
        <div class="row"><span class="row-label">发送音效</span><input type="checkbox" class="switch" data-setting="sound"></div>
        <div class="row"><span class="row-label">随机播放</span><input type="checkbox" class="switch" data-setting="soundRandom"></div>
        <div id="soundList"></div>
        <button class="row action" id="addSoundBtn"><span>添加音效</span><svg class="ic"><use href="#i-plus"></use></svg></button>
      </div>

      <div class="group-title">通知</div>
      <div class="setting-card">
        <div class="row"><span class="row-label">系统通知</span><input type="checkbox" class="switch" data-setting="notify"></div>
        <div class="row"><span class="row-label">后台保活</span><input type="checkbox" class="switch" data-setting="bgKeepAlive"></div>
      </div>

      <div class="group-title">数据</div>
      <div class="setting-card">
        <button class="row action" id="exportAllBtn"><span>导出全部</span><svg class="ic"><use href="#i-download"></use></svg></button>
        <button class="row action" id="importAllBtn"><span>导入全部</span><svg class="ic"><use href="#i-upload"></use></svg></button>
        <button class="row action" id="clearMsgsBtn"><span>清空聊天</span><svg class="ic"><use href="#i-trash"></use></svg></button>
        <button class="row action danger" id="resetAllBtn"><span>重置全部</span><svg class="ic"><use href="#i-reset"></use></svg></button>
      </div>
      <div class="settings-foot">HUIXUN</div>
    </div>
  </section>

  <div class="sheet-mask" id="mask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast"></div>

  <div class="intro" id="intro">
    <div class="intro-inner">
      <div class="intro-ring"><span></span></div>
      <div class="intro-brand"><span>回</span><span>讯</span></div>
      <div class="intro-sub">H U I X U N</div>
      <div class="intro-rule"></div>
    </div>
  </div>
</div>

<input type="file" id="bgFile" accept="image/*" hidden>
<input type="file" id="avatarFile" accept="image/*" hidden>
<input type="file" id="allImport" accept="application/json,.json" hidden>

<script src="js/core.js"></script>
<script src="js/chat.js"></script>
<script src="js/cards.js"></script>
<script src="js/settings.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
